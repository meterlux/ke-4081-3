<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!--STANDALONE-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JJL">
<meta name="theme-color" content="#0e1012">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<!--/STANDALONE-->
<title>JJL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: the rule owns the screen; a slim control deck sits under it (hidden in Expert). */
:root{
  --bg:#0e1012; --panel:#15181b; --raise:#1f2327; --raise2:#272c31; --line:#2c3136;
  --ink:#ece5d3; --muted:#9ba09c; --brass:#d6a23e; --brass-ink:#1b1408;
  --red:#e86a5a; --ok:#6cc08a; --blue:#5aa2ec;
  --f-ui:"Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-cond:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{position:fixed;inset:0;overflow:hidden;font-family:var(--f-ui);font-size:15px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st);background:var(--bg)}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#rule{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:absolute;visibility:hidden;padding:var(--st) var(--sr) var(--sb) var(--sl)}

button{font:inherit;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:9px;
  height:34px;padding:0 12px;touch-action:manipulation;cursor:pointer;white-space:nowrap}
button:active{background:var(--raise2)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button:disabled{opacity:.38}
button.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:600}
button.ghost{background:transparent;border-color:transparent}
button.icon{width:38px;padding:0;display:inline-grid;place-items:center}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#panel{flex:none;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;
  padding:6px max(10px,var(--sr)) calc(6px + var(--sb)) max(10px,var(--sl))}
.row{display:flex;align-items:center;gap:6px;min-width:0}
.seg{display:flex;background:#0a0c0e;border-radius:10px;padding:2px;flex:none}
.seg button{background:transparent;border:0;height:30px;padding:0 11px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--raise2);color:var(--brass)}
#ctx{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.flipLbl{font-family:var(--f-cond);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px}

/* learn */
#lessonBtn{background:transparent;border:0;padding:0 4px;font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;color:var(--ink)}
#lessonBtn::after{content:" ▾";color:var(--muted)}
#stepNo{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;font-size:13px}
.chip{flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;letter-spacing:.02em}
.chip.try{background:#2c2410;color:var(--brass)}
.chip.done{background:#173322;color:var(--ok)}
#learnUI{align-items:flex-start}
#stepText{flex:1;min-width:0;margin:0;line-height:1.38;font-size:14.5px;max-height:3.2em;overflow:auto;padding-top:2px}
#stepText b{color:#fff;font-weight:600}
.nav{display:flex;gap:6px;flex:none}

/* quiz */
.q{font-family:var(--f-cond);font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ans{font-family:var(--f-cond);font-size:21px;min-width:96px;height:32px;padding:0 10px;border-radius:8px;background:#0a0c0e;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:flex-end;font-variant-numeric:tabular-nums;flex:none}
.ans:empty::before{content:"answer";color:#555b5f;font-size:16px}
.ans.blink::after{content:"";width:2px;height:20px;background:var(--brass);margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.fb{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fb.ok{color:var(--ok)} .fb.miss{color:var(--red)} .fb.info{color:var(--muted);font-weight:500}
.keypad{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px;flex:1;min-width:0}
.keypad button{padding:0;font-family:var(--f-cond);font-size:20px;height:38px}
#quizRow button.act{height:38px}
.meta{font-family:var(--f-cond);font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* overlays on stage */
#bubble{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(640px,calc(100% - 24px - var(--sl) - var(--sr)));
  max-height:calc(100% - 20px);overflow:auto;background:rgba(22,25,28,.97);border:1px solid #3a4046;border-radius:14px;
  padding:14px 16px 12px;box-shadow:0 12px 40px rgba(0,0,0,.55);font-size:15px;line-height:1.5;-webkit-user-select:text;user-select:text;box-sizing:border-box}
#bubble h3{margin:0 0 6px;font-family:var(--f-cond);font-size:20px;font-weight:600;color:var(--brass);letter-spacing:.01em;text-wrap:balance}
#bubble p{margin:0 0 9px} #bubble ul{margin:0 0 9px;padding-left:20px} #bubble li{margin:2px 0}
#bubble .fx{font-family:var(--f-cond);font-size:17px;background:#0d0f11;border-radius:6px;padding:2px 7px}
#bubble .close{position:sticky;float:right;top:0;margin:-4px -6px 0 8px;height:30px;font-size:13px}
#caption{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:calc(100% - 140px - var(--sl) - var(--sr));
  background:rgba(14,16,18,.9);border:1px solid #3a4046;border-radius:99px;padding:6px 14px;font-size:14px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-sizing:border-box}
#caption .n{color:var(--brass);font-weight:600;margin-right:6px}
#xbtns{position:absolute;right:max(10px,var(--sr));bottom:max(8px,var(--sb));pointer-events:none}
#xbtns button{pointer-events:auto;width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;color:#f3c463;background:rgba(14,16,18,.62);border-color:rgba(243,196,99,.35);opacity:.6;transition:opacity .4s,box-shadow .4s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hint0{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--muted);background:rgba(14,16,18,.8);
  padding:5px 12px;border-radius:99px;pointer-events:none;white-space:nowrap;transition:opacity .6s}

/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:calc(10px + var(--st)) max(10px,var(--sr)) calc(10px + var(--sb)) max(10px,var(--sl))}
#sheetCard{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
#sheetHead{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 16px;border-bottom:1px solid var(--line)}
#sheetHead h2{margin:0;flex:1;font-family:var(--f-cond);font-size:21px;font-weight:600;letter-spacing:.01em}
#sheetBody{overflow:auto;padding:12px 16px 16px;line-height:1.5;-webkit-user-select:text;user-select:text}
#sheetBody h4{margin:14px 0 4px;font-family:var(--f-cond);font-size:17px;color:var(--brass);font-weight:600;letter-spacing:.02em}
#sheetBody p{margin:0 0 8px} #sheetBody ul{margin:0 0 8px;padding-left:20px}
.list{display:flex;flex-direction:column;gap:6px}
.list button{display:flex;justify-content:space-between;align-items:center;height:auto;min-height:44px;padding:8px 12px;text-align:left;white-space:normal;gap:10px}
.list button .s{color:var(--muted);font-size:13px;flex:none}
.list button.cur{border-color:var(--brass)}
.list button .tick{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:38px;min-width:58px;font-family:var(--f-cond);font-size:18px}
.chips button[aria-pressed="true"]{background:#2c2410;border-color:var(--brass);color:var(--brass)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.set .d{color:var(--muted);font-size:13px}
.tog{width:52px;height:30px;border-radius:99px;padding:0;position:relative;background:#30363b;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfd3d6;transition:transform .15s}
.tog[aria-pressed="true"]{background:var(--brass)} .tog[aria-pressed="true"]::after{transform:translateX(22px)}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.res td,table.res th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.res th{color:var(--muted);font-weight:500}
.big{font-family:var(--f-cond);font-size:44px;font-weight:600;color:var(--brass);line-height:1}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

body[data-mode="expert"] #panel{display:none}
body:not([data-mode="expert"]) #xbtns{display:none}

/* Always landscape: when the phone is upright (or rotation-locked), turn the whole app sideways.
   Safe-area insets are re-mapped to the rotated edges. */
@media (orientation:portrait){
  body:not(.upright){--sl:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-bottom,0px);--st:0px;--sb:env(safe-area-inset-left,0px)}
  body:not(.upright) #app{inset:auto;top:0;left:0;width:var(--vh,100vh);height:var(--vw,100vw);transform-origin:0 0;transform:translateX(var(--vw,100vw)) rotate(90deg)}
}
#orientBtn{display:none}
@media (orientation:portrait){#orientBtn{display:inline-grid}}
body.upright #orientBtn svg{transform:rotate(90deg)}
#xbtns svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#xbtns button.lit,#xbtns button:active{opacity:1;box-shadow:0 0 18px rgba(243,196,99,.55)}
/* upright view: narrow panel */
body.upright #headRow{flex-wrap:wrap}
body.upright #ctx{order:5;flex-basis:100%}
body.upright #flipTxt{display:none}
body.upright .keypad{grid-template-columns:repeat(7,minmax(0,1fr))}
body.upright #quizRow{flex-wrap:wrap}
body.upright #quizRow .acts{flex-basis:100%}
body.upright #quizRow .acts button{flex:1}
body.upright #learnUI{flex-wrap:wrap}
body.upright #stepText{flex-basis:100%;max-height:7.5em;font-size:15px}
body.upright .nav{flex-basis:100%} body.upright .nav button{flex:1}
@media (prefers-reduced-motion:reduce){ .ans.blink::after{animation:none} }
</style>
</head>
<body data-mode="learn">
<div id="app">
  <div id="stage">
    <canvas id="rule" aria-label="Slide rule. Drag to move the rule or the slide."></canvas>
    <div id="probe"></div>
    <div id="caption" hidden></div>
    <div id="hint0" hidden>Drag a fixed strip to move the rule · drag the middle strip to move the slide · swipe up or down to flip · pinch to zoom</div>
    <div id="xbtns">
      <button id="xMenu" aria-label="Back to Learn"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
    </div>
    <div id="bubble" hidden></div>
  </div>
  <div id="panel">
    <div class="row" id="headRow">
      <div class="seg" role="tablist" aria-label="Mode">
        <button data-mode="learn">Learn</button><button data-mode="practice">Practice</button><button data-mode="test">Test</button><button data-mode="expert">Expert</button>
      </div>
      <div id="ctx">
        <div id="ctxLearn" class="row" style="flex:1;min-width:0">
          <button id="lessonBtn"></button><span id="stepNo"></span><span id="tryChip" class="chip" hidden></span>
        </div>
        <div id="ctxQuiz" class="row" style="flex:1;min-width:0" hidden>
          <button id="topicsBtn">Topics</button>
          <span id="tMeta" class="meta" hidden></span>
          <div id="qText" class="q"></div>
          <div id="qAns" class="ans blink"></div>
          <div id="qFb" class="fb"></div>
        </div>
      </div>
      <button id="flipBtn" aria-label="Flip the rule over"><span class="flipLbl">⟲<span id="flipTxt"> Show back</span></span></button>
      <button id="orientBtn" class="icon" aria-label="Switch between sideways and upright view"><svg class="i" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10.5 18.5h3"/></svg></button>
      <button id="gearBtn" class="icon" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="row" id="learnUI">
      <p id="stepText"></p>
      <div class="nav">
        <button id="prevBtn" aria-label="Previous step">‹</button>
        <button id="moreBtn">More</button>
        <button id="showBtn">Show me</button>
        <button id="nextBtn" class="primary">Next ›</button>
      </div>
    </div>
    <div class="row" id="quizRow" hidden>
      <div class="keypad" id="keypad"></div>
      <div class="acts" style="display:flex;gap:6px">
        <button id="qHint" class="act">Hint</button>
        <button id="qShow" class="act">Show me</button>
        <button id="qSkip" class="act" hidden>Skip</button>
        <button id="qCheck" class="act primary">Check</button>
      </div>
    </div>
  </div>
<div id="sheet" hidden>
  <div id="sheetCard" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div id="sheetHead"><h2 id="sheetTitle"></h2><button id="sheetClose">Done</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
</div>

<script src="textures.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const L10=Math.log10, LN=Math.log, PI=Math.PI, E=Math.E, DEG=PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, mod1=x=>x-Math.floor(x);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* =====================================================================
   SCALES — modeled on the K&E 4081-3 Log Log Duplex Decitrig (20 scales)
   x is the position along the scale, 0 = left index, 1 = right index.
   ===================================================================== */
const SC={};
const R=(from,to,steps)=>({from,to,steps});
const lz=v=>String(v).replace(/^0\./,'.');
const sub12=()=>[1.1,1.2,1.3,1.4,1.5,1.6,1.7,1.8,1.9].map(v=>({v,t:String(Math.round((v-1)*10)),tier:1,sm:1}));
const D19=()=>[1,2,3,4,5,6,7,8,9].map(v=>({v,t:String(v)}));
function trigLabs(list,lowTier=[]){
  const out=[];
  list.forEach(th=>{
    const tier=lowTier.includes(th)?1:0;
    if(th===90||th===45){out.push({v:th,t:String(th),tier});return;}
    out.push({v:th,t:String(th),pos:'r',tier});
    out.push({v:th,t:String(+(90-th).toFixed(1)),pos:'l',ink:'r',sm:1,tier});
  });
  return out;
}
function scale(name,o){
  o.name=name;o.ink=o.ink||'k';o.labels=o.labels||[];o.extra=o.extra||[];
  const ticks=[],seen=new Set();
  const push=(x,lv,ri)=>{const k=Math.round(x*1e7);if(seen.has(k))return;seen.add(k);ticks.push({x,lv,ri});};
  o.ranges.forEach((r,ri)=>{
    const fine=r.steps[r.steps.length-1], mult=r.steps.map(s=>Math.round(s/fine));
    const k0=Math.ceil(r.from/fine-1e-6), k1=Math.floor(r.to/fine+1e-6);
    for(let k=k0;k<=k1;k++){
      const x=o.f(k*fine); if(!isFinite(x))continue;
      let lv=mult.findIndex(m=>k%m===0); if(lv<0)lv=mult.length-1;
      push(x,lv,ri);
      if(o.folded){ if(x<0.035)push(x+1,lv,ri); if(x>0.965)push(x-1,lv,ri); }
    }
  });
  o.extra.forEach(e=>push(e.x!==undefined?e.x:o.f(e.v),e.lv,-1));
  ticks.sort((a,b)=>a.x-b.x);
  o.ticks=ticks;
  const by={};ticks.forEach(t=>(by[t.ri]=by[t.ri]||[]).push(t));
  o.gap={};
  for(const ri in by){
    const arr=by[ri],mx=Math.max(...arr.map(t=>t.lv));o.gap[ri]=[];
    for(let L=0;L<=mx;L++){let p=null,g=Infinity;for(const t of arr)if(t.lv<=L){if(p!==null)g=Math.min(g,t.x-p);p=t.x;}o.gap[ri][L]=ri==='-1'?Infinity:g;}
  }
  o.labs=o.labels.map(l=>({...l,x:l.x!==undefined?l.x:o.f(l.v),tier:l.tier||0}));
  SC[name]=o;return o;
}
const LOGR=[R(1,2,[1,.5,.1,.05,.01]),R(2,4,[1,.5,.1,.02]),R(4,10,[1,.5,.1,.05])];
const CDLAB=[...D19(),{v:10,t:'1'},...sub12(),{v:PI,t:'π',sm:1}];
const FOLD=L10(PI);
const lin=x=>10**x;
scale('D',{f:L10,inv:lin,ranges:LOGR,labels:CDLAB,extra:[{v:PI,lv:1}]});
scale('C',{f:L10,inv:lin,ranges:LOGR,labels:CDLAB,extra:[{v:PI,lv:1}]});
scale('CI',{f:v=>1-L10(v),inv:x=>10**(1-x),ranges:LOGR,labels:CDLAB,extra:[{v:PI,lv:1}],ink:'r'});
const FLAB=[...D19(),...sub12(),{x:0,t:'π'},{x:1,t:'π'}];
scale('DF',{f:v=>mod1(L10(v)-FOLD),inv:x=>PI*10**x,folded:1,ranges:LOGR,labels:FLAB,extra:[{x:0,lv:0},{x:1,lv:0}]});
scale('CF',{f:v=>mod1(L10(v)-FOLD),inv:x=>PI*10**x,folded:1,ranges:LOGR,labels:FLAB,extra:[{x:0,lv:0},{x:1,lv:0}]});
scale('CIF',{f:v=>mod1(1-L10(v)-FOLD),inv:x=>10/(PI*10**x),folded:1,ranges:LOGR,labels:[...D19(),...sub12()],ink:'r'});
const AR=[R(1,2,[1,.5,.1,.02]),R(2,5,[1,.5,.1,.05]),R(5,10,[1,.5,.1]),R(10,20,[10,5,1,.2]),R(20,50,[10,5,1,.5]),R(50,100,[10,5,1])];
const ALAB=[...D19(),...[1,2,3,4,5,6,7,8,9].map(v=>({v:v*10,t:String(v)})),{v:100,t:'1'}];
scale('A',{f:v=>L10(v)/2,inv:x=>10**(2*x),ranges:AR,labels:ALAB,extra:[{v:PI,lv:2}]});
scale('B',{f:v=>L10(v)/2,inv:x=>10**(2*x),ranges:AR,labels:ALAB,extra:[{v:PI,lv:2}]});

    drag.axis=(settings.flickFlip&&Math.abs(dy)>Math.abs(dx)*1.15)?'v':'h';
    if(drag.axis==='v'){flipFrom=st.face;flipDir=dy>0?1:-1;}
  }
  if(drag.axis==='v'){setFlipP((p.y-drag.y0)*flipDir/drag.span);invalidate();return;}
  const step=p.x-drag.lx,dt=Math.max(1,now-drag.lt);drag.lx=p.x;drag.lt=now;
  drag.vs=drag.vs*.55+(Math.abs(step)/dt)*.45;
  const d=step*gain(drag.vs,drag.key)/Lpx();
  st[drag.key]=clamp(st[drag.key]+(drag.key==='xc'?-d:d),LIM[drag.key][0],LIM[drag.key][1]);
  checkTry();invalidate();
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;const p=local(e);ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2){pinch=null;save();}drag=null;return;}
  if(!drag)return;
  if(!drag.axis){if(performance.now()-drag.t0<400)tap(p);drag=null;return;}
  if(drag.axis==='v'){
    const s=drag.samples,a=s[0],b=s[s.length-1],vy=(b[2]-a[2])/Math.max(1,b[0]-a[0])*flipDir;
    const go=e.type==='pointerup'&&(flipP>.2||(vy>.2&&flipP>.04));
    drag=null;settleFlip(go?1:0);return;
  }
  drag=null;save();
}

function tap(p){
  if(st.mode==='expert'){const b=$('#xMenu');b.classList.add('lit');clearTimeout(bulbT);bulbT=setTimeout(()=>b.classList.remove('lit'),3500);}
  const G=geom();const r=G.rows.find(q=>p.y>=q.y&&p.y<q.y+q.h);if(!r)return;
  const inLeft=p.x<view.sl+56, inRight=readoutsOn()&&p.x>view.w-view.sr-84;
  const onName=Math.abs(p.x-(X(-0.04+(r.slide?st.s:0))))<40;

}

function grade(p,val){

function newPractice(){
  cancelWalk();prob=newProblem();answered=false;setEntry('');fb('','');
  $('#qText').textContent=prob.q+' =';hl=new Set();marks=[];
  $('#qCheck').textContent='Check';invalidate();
}
function checkPractice(){
  if(answered){newPractice();return;}
  const v=parseFloat(entry);const r=grade(prob,v);
  if(!r){fb('Enter a number first','info');return;}
  const pct=(prob.cat==='log')?`±${r.err.toFixed(3)}`:`${(r.err*100).toFixed(2)}% off`;
  if(r.g==='miss'){fb(`Not quite — ${sig(prob.ans)}. Tap Show me.`,'miss');}
  else{fb(`${r.g==='excellent'?'Excellent':'Good'} — ${sig(prob.ans)} (${pct})`,'ok');}
  answered=true;$('#qCheck').textContent='Next ›';
}
async function walk(steps){
  walking=true;hideBubble();
  for(let i=0;i<steps.length&&walking;i++){
    const s=steps[i];caption(`${i+1}/${steps.length}`,s.t);hl=new Set(s.hl||[]);marks=s.mk||[];invalidate();
    if(s.st)await goTo(s.st,.9);if(!walking)break;await sleep(REDUCED?900:1500);
  }
  if(walking){walking=false;setTimeout(()=>{if(!walking)caption(0,'');},2500);}
}
/* test */
function startTest(){
  closeSheet();quiz.list=[];quiz.n=0;quiz.active=true;quiz.t0=performance.now();
  clearInterval(quiz.timer);quiz.timer=setInterval(updMeta,500);nextTest();
}
function updMeta(){if(!quiz.active)return;const s=Math.floor((performance.now()-quiz.t0)/1000);$('#tMeta').textContent=`${Math.min(quiz.n+1,10)}/10 · ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function nextTest(){
  if(quiz.n>=10){finishTest();return;}
  prob=newProblem();answered=false;setEntry('');fb('','');
  $('#qText').textContent=prob.q+' =';hl=new Set();marks=[];updMeta();invalidate();
}
function submitTest(skip){
  if(!quiz.active){openTestStart();return;}if(answered)return;
  const v=skip?NaN:parseFloat(entry);const r=grade(prob,v);
  if(!skip&&!r){fb('Enter a number, or Skip','info');return;}
  const g=r?r.g:'miss';answered=true;
  quiz.list.push({q:prob.q,you:skip?'—':entry.replace('-','−'),ans:sig(prob.ans),g});
  fb(g==='miss'?`✗ ${sig(prob.ans)}`:`✓ ${g==='excellent'?'Excellent':'Good'}`,g==='miss'?'miss':'ok');
  quiz.n++;setTimeout(nextTest,g==='miss'?1600:900);
}
function finishTest(){
  quiz.active=false;clearInterval(quiz.timer);
  const pts=quiz.list.reduce((a,r)=>a+(r.g==='excellent'?10:r.g==='good'?7:0),0);
  const secs=Math.round((performance.now()-quiz.t0)/1000),key=cats.slice().sort().join(',');
  const prev=best[key];const isBest=pts>0&&(!prev||pts>prev.pts||(pts===prev.pts&&secs<prev.secs));if(isBest){best[key]={pts,secs};save();}
  $('#qText').textContent='Test complete';fb(`${pts}/100`,'ok');$('#tMeta').textContent='';
  openSheet('Test results',`<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span class="big">${pts}</span><span>out of 100 · ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}${isBest?' · <b style="color:var(--ok)">personal best</b>':prev?` · best ${prev.pts}`:''}</span></div>
   <p style="color:var(--muted);margin-top:6px">Excellent (within 0.3%) = 10 · Good (within 0.6%) = 7 · Miss = 0</p>
   <table class="res"><tr><th>Problem</th><th>You</th><th>Answer</th><th></th></tr>${quiz.list.map(r=>`<tr><td>${r.q}</td><td>${r.you}</td><td>${r.ans}</td><td style="color:${r.g==='miss'?'var(--red)':'var(--ok)'}">${r.g==='miss'?'✗':r.g==='excellent'?'✓✓':'✓'}</td></tr>`).join('')}</table>
   <div class="btnrow"><button class="primary" id="again">Take another test</button><button id="toPrac">Practice these topics</button></div>`,
   b=>{b.querySelector('#again').onclick=startTest;b.querySelector('#toPrac').onclick=()=>{closeSheet();setMode('practice');};});
}
function openTestStart(){
  const key=cats.slice().sort().join(','),b=best[key];
  openSheet('Test',`<p>Ten problems from your chosen topics. Readings, hints and walkthroughs are off. Answers within 0.3% score 10, within 0.6% score 7.</p>
   <h4>Topics</h4><div class="chips" id="tc">${CATS.map(([k,l])=>`<button data-c="${k}" aria-pressed="${cats.includes(k)}">${l}</button>`).join('')}</div>
   <p style="margin-top:10px;color:var(--muted)" id="bestLine">${b?`Best for these topics: ${b.pts}/100`:'No score yet for these topics.'}</p>
   <div class="btnrow"><button class="primary" id="go">Start test</button></div>`,
   el=>{wireChips(el.querySelector('#tc'),()=>{const k=cats.slice().sort().join(','),bb=best[k];el.querySelector('#bestLine').textContent=bb?`Best for these topics: ${bb.pts}/100`:'No score yet for these topics.';});el.querySelector('#go').onclick=startTest;});
}
function wireChips(box,after){
  box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c,on=cats.includes(c);
    if(on&&cats.length===1)return;cats=on?cats.filter(q=>q!==c):[...cats,c];b.setAttribute('aria-pressed',String(!on));save();after&&after();});
}
function openTopics(){
  if(st.mode==='test'){openTestStart();return;}
  openSheet('Practice topics',`<p>Pick what to practice. Problems mix the topics you choose.</p><div class="chips" id="pc">${CATS.map(([k,l])=>`<button data-c="${k}" aria-pressed="${cats.includes(k)}">${l}</button>`).join('')}</div>
  <div class="btnrow"><button class="primary" id="pgo">New problem</button></div>`,el=>{wireChips(el.querySelector('#pc'));el.querySelector('#pgo').onclick=()=>{closeSheet();newPractice();};});
}

/* =====================================================================
   MODES + SETTINGS
   ===================================================================== */
function setMode(m){
  const prevMode=st.mode;st.mode=m;document.body.dataset.mode=m;cancelWalk();hideBubble();
  $$('.seg [data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));
  const learn=m==='learn',quizM=m==='practice'||m==='test';
  $('#ctxLearn').hidden=!learn;$('#learnUI').hidden=!learn;$('#ctxQuiz').hidden=!quizM;$('#quizRow').hidden=!quizM;
  $('#qHint').hidden=m!=='practice';$('#qShow').hidden=m!=='practice';$('#qSkip').hidden=m!=='test';$('#topicsBtn').hidden=false;
  $('#tMeta').hidden=m!=='test';$('#qCheck').textContent=m==='test'?'Submit':'Check';
  if(learn)renderStep(prevMode!=='learn');
  else{hl=new Set();marks=[];}
  if(m==='practice')newPractice();
  if(m==='test'){quiz.active=false;$('#qText').textContent='Ready when you are';setEntry('');fb('','');openTestStart();}
  requestAnimationFrame(measure);save();
}
$$('.seg [data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('#xMenu').onclick=()=>setMode('learn');
const doFlip=()=>{cancelWalk();flipTo(st.face==='front'?'back':'front').then(()=>{save();checkTry();});};
$('#flipBtn').onclick=doFlip;
function applyOrient(){document.body.classList.toggle('upright',!!settings.upright&&innerHeight>innerWidth);requestAnimationFrame(measure);}
$('#orientBtn').onclick=()=>{settings.upright=!settings.upright;applyOrient();save();};
window.addEventListener('resize',()=>applyOrient());
$('#nextBtn').onclick=nextStep;$('#prevBtn').onclick=prevStep;
$('#moreBtn').onclick=()=>{if(bubbleKind==='more'){hideBubble();return;}const s=stepState();if(s.m)showBubble(s.t,s.m,'more');};
$('#showBtn').onclick=()=>{lessonSol();showMe();};
$('#lessonBtn').onclick=openLessons;
$('#topicsBtn').onclick=openTopics;
$('#qCheck').onclick=()=>st.mode==='test'?submitTest(false):checkPractice();
$('#qSkip').onclick=()=>submitTest(true);
$('#qHint').onclick=()=>{if(prob)showBubble('Hint',`<p>${prob.hint}</p>`,'hint');};
$('#qShow').onclick=()=>{if(prob)walk(prob.steps);};
$('#panel').addEventListener('pointerdown',e=>{if(bubbleKind==='info'&&!e.target.closest('#moreBtn'))hideBubble();});
document.addEventListener('keydown',e=>{
  if(!$('#sheet').hidden){if(e.key==='Escape')closeSheet();return;}
  if(st.mode==='practice'||st.mode==='test'){
    if(/^[0-9]$/.test(e.key)){if(answered&&st.mode==='practice')newPractice();setEntry(entry+e.key);}
    else if(e.key==='.'&&!entry.includes('.'))setEntry(entry+'.');
    else if(e.key==='-')setEntry(entry.startsWith('-')?entry.slice(1):'-'+entry);
    else if(e.key==='Backspace')setEntry(entry.slice(0,-1));
    else if(e.key==='Enter')$('#qCheck').click();
  }else if(st.mode==='learn'){if(e.key==='ArrowRight')nextStep();if(e.key==='ArrowLeft')prevStep();}
  if(e.key==='f')doFlip();
});
function tog(id,on){return `<button class="tog" id="${id}" aria-pressed="${on}" aria-label="toggle"></button>`;}
const ABOUT=`<p><b>JJL</b> is a working simulator of your slide rule: every scale is computed, so readings are exact.</p>
<h4>What you have</h4>
<p><b>Keuffel &amp; Esser 4081-3 Log Log Duplex Decitrig</b>, the 10-inch (25 cm) engineering model, mahogany core with celluloid faces and aluminum end brackets. K&amp;E made the 4081 family from 1937 into the early 1970s, and it was the most common professional slide rule in America.</p>
<p>Your rule has 20 scales. Front: LL02, LL03, DF · [CF, CIF, CI, C] · D, LL3, LL2. Back: LL01, K, A · [B, T, ST, S] · D, L, LL1. Later versions added a DI scale (21 scales); yours has none.</p>
<h4>When was it made?</h4>
<p>The serial number <b>601428</b> fits K&amp;E’s numbering for <b>about 1951</b> and also <b>about 1962</b>, because their counter restarted in 1955. Clues that settle it:</p>
<ul><li><b>ST vs SRT.</b> K&amp;E renamed the small-angle scale from ST to SRT in 1956. Your back face reads <b>ST</b>, which points to the early 1950s.</li>
<li><b>Cursor lens.</b> Glass lenses gave way to molded plastic in 1958. Glass is heavier and rings when tapped with a fingernail.</li>
<li><b>Fasteners.</b> Rivets on the end brackets mean pre-1958; removable hex screws mean later.</li>
<li><b>Model number.</b> From 1962 K&amp;E renumbered everything as 68-xxxx. A rule stamped 4081-3 is older than that.</li></ul>
<p>Taken together, an early-1950s rule is the most likely answer. Clark McCoy’s K&amp;E catalog site (mccoys-kecatalogs.com) has the serial table and production-change list, and the Oughtred Society and International Slide Rule Museum are friendly places to ask.</p>
<h4>Care</h4><p>Wipe with a barely damp cloth; no solvents (they dissolve celluloid markings). A tiny bit of paraffin on the slide edges eases a sticky slide. Store it out of sun; the ivory yellowing is from age and is normal.</p>
<h4>Install on your iPhone</h4><p>Open this page in Safari, tap Share, then <b>Add to Home Screen</b>. It then opens full screen with no browser bars. Turn on rotation and hold the phone sideways.</p>
<p style="color:var(--muted);font-size:13px">This is an independent simulator built for learning; it is not affiliated with Keuffel &amp; Esser. Scale layout copied from your photos. The end gussets are drawn from measurements; better photos can replace them later.</p>`;
function openSettings(){
  openSheet('Settings',`
   <div class="set"><div><div>Readings column</div><div class="d">Values under the hairline, shown on the right in Learn${''}</div></div>${tog('sR',settings.readLearn)}</div>
   <div class="set"><div><div>Readings in Practice</div><div class="d">Off is closer to the real thing</div></div>${tog('sRP',settings.readPractice)}</div>
   <div class="set"><div><div>Scale names in margin</div><div class="d">Keeps names visible when the rule’s ends are off screen</div></div>${tog('sN',settings.names)}</div>
   <div class="set"><div><div>Red hairline</div><div class="d">Easier to see than the original black</div></div>${tog('sH',settings.hair==='red')}</div>
   <div class="set"><div><div>Swipe to flip</div><div class="d">Swipe up or down on the rule to roll it over</div></div>${tog('sM',settings.flickFlip)}</div>
   <div class="set"><div><div>Upright view</div><div class="d">When the phone is vertical, show the rule large and cropped instead of turning the app sideways</div></div>${tog('sU',settings.upright)}</div>
   <div class="btnrow"><button id="sReset">Center the rule</button><button id="sZoom">Reset zoom</button><button id="sAbout">About this rule</button></div>`,
   el=>{
     const bind=(id,fn)=>{const b=el.querySelector('#'+id);b.onclick=()=>{const v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(v));fn(v);save();invalidate();};};
     bind('sR',v=>settings.readLearn=v);bind('sRP',v=>settings.readPractice=v);bind('sN',v=>settings.names=v);bind('sH',v=>settings.hair=v?'red':'black');bind('sM',v=>settings.flickFlip=v);bind('sU',v=>{settings.upright=v;applyOrient();});
     el.querySelector('#sReset').onclick=()=>{closeSheet();goTo({xc:.5,s:0});};
     el.querySelector('#sZoom').onclick=()=>{zoom={...ZOOM_DEF};save();invalidate();closeSheet();};
     el.querySelector('#sAbout').onclick=()=>openSheet('About this rule',ABOUT);
   });
}
$('#gearBtn').onclick=openSettings;

/* =====================================================================
   BOOT
   ===================================================================== */
load();if(settings.flickFlip===undefined)settings.flickFlip=true;applyOrient();buildKeypad();makeGrain();makeBrush();loadTex();updateFlipLbl();
new ResizeObserver(measure).observe($('#stage'));
window.addEventListener('orientationchange',()=>setTimeout(measure,250));window.addEventListener('resize',measure);
setMode(st.mode);
if(settings.hint0&&st.mode!=='learn'){const h=$('#hint0');h.hidden=false;}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>invalidate());
setTimeout(invalidate,600);
window.__sr={st,SC,read,on,LESSONS,GEN,grade,setMode,goTo,dbg:()=>({flipP,flipFrom,flipA:!!flipA,drag:drag&&{axis:drag.axis}})};
window.__jump=(l,s)=>{prog.lesson=l;prog.step=s;renderStep();};
})();
</script>
